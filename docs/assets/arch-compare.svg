<title id="t">Same code, different verdict per architecture</title>
<desc id="d">A comparison table. Logic calling a repository directly: OK in MVVM, ARCH-012 medium in MVN, OK in Bloc. Logic depending on sibling logic: ARCH-010 low in MVVM, OK in MVN via ref.watch in build, ARCH-010 medium in Bloc. A pass-through use case: Info in MVVM, prescribed in MVN, Info in Bloc. A view importing a repository to construct its logic: ARCH-008 medium in MVVM and MVN, OK in Bloc inside BlocProvider or RepositoryProvider.</desc>
