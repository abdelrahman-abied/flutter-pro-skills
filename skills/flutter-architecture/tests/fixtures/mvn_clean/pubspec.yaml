name: mvn_clean
description: Clean Architecture + MVN fixture (golden template from the mvn spec).
publish_to: 'none'

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.0   # use ^3.x for Riverpod 3 (generic Ref)
  riverpod_annotation: ^2.6.0
  meta: ^1.15.0

dev_dependencies:
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.0
